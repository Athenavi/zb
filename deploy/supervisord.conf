; Supervisor配置文件
; 用于管理和监控Gunicorn进程

[supervisord]
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info
pidfile=/var/run/supervisord.pid
nodaemon=false
minfds=1024
minprocs=200

[program:zb_app]
command=gunicorn --config gunicorn.conf.py wsgi:application
directory=/path/to/your/project
user=www-data
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/zb_app.log
stderr_logfile=/var/log/supervisor/zb_app_err.log
environment=PATH="/path/to/your/project/venv/bin"

[group:zb]
programs=zb_app
priority=999