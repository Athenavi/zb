{% extends "dashboard/base.html" %}

{% block title %}管理后台 - 分析仪表板{% endblock %}
{% block page_title %}分析仪表板{% endblock %}

{% block content %}
    <!-- 统计卡片 -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
        <div class="bg-white rounded-xl shadow-sm p-6 card-hover">
            <div class="flex items-center">
                <div class="p-3 rounded-lg bg-blue-100 text-primary">
                    <i class="fas fa-eye text-xl"></i>
                </div>
                <div class="ml-4">
                    <h2 class="text-sm font-medium text-gray-500">总页面访问量</h2>
                    <p class="text-2xl font-semibold text-gray-800" id="totalPageViews">0</p>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm p-6 card-hover">
            <div class="flex items-center">
                <div class="p-3 rounded-lg bg-green-100 text-success">
                    <i class="fas fa-user-check text-xl"></i>
                </div>
                <div class="ml-4">
                    <h2 class="text-sm font-medium text-gray-500">总用户活动</h2>
                    <p class="text-2xl font-semibold text-gray-800" id="totalUserActivities">0</p>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm p-6 card-hover">
            <div class="flex items-center">
                <div class="p-3 rounded-lg bg-purple-100 text-purple-600">
                    <i class="fas fa-users text-xl"></i>
                </div>
                <div class="ml-4">
                    <h2 class="text-sm font-medium text-gray-500">唯一访客</h2>
                    <p class="text-2xl font-semibold text-gray-800" id="totalUniqueUsers">0</p>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm p-6 card-hover">
            <div class="flex items-center">
                <div class="p-3 rounded-lg bg-yellow-100 text-warning">
                    <i class="fas fa-chart-line text-xl"></i>
                </div>
                <div class="ml-4">
                    <h2 class="text-sm font-medium text-gray-500">最近7天访问量</h2>
                    <p class="text-2xl font-semibold text-gray-800" id="recentPageViews">0</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 图表和数据区域 -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <!-- 最活跃用户 -->
        <div class="bg-white rounded-xl shadow-sm p-6">
            <h2 class="text-lg font-semibold text-gray-800 mb-6">最活跃用户</h2>
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                    <tr>
                        <th scope="col"
                            class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">用户名
                        </th>
                        <th scope="col"
                            class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">活动数
                        </th>
                    </tr>
                    </thead>
                    <tbody id="activeUsersTable" class="bg-white divide-y divide-gray-200">
                    <!-- 数据将通过JavaScript动态加载 -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 热门页面 -->
        <div class="bg-white rounded-xl shadow-sm p-6">
            <h2 class="text-lg font-semibold text-gray-800 mb-6">热门页面</h2>
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                    <tr>
                        <th scope="col"
                            class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">页面
                        </th>
                        <th scope="col"
                            class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">访问量
                        </th>
                    </tr>
                    </thead>
                    <tbody id="popularPagesTable" class="bg-white divide-y divide-gray-200">
                    <!-- 数据将通过JavaScript动态加载 -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 图表区域 -->
    <div class="mt-8 bg-white rounded-xl shadow-sm p-6">
        <h2 class="text-lg font-semibold text-gray-800 mb-6">访问趋势</h2>
        <div class="h-80">
            <canvas id="analyticsChart"></canvas>
        </div>
    </div>
{% endblock %}

{% block extra_scripts %}
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        // 获取分析数据
        async function loadAnalyticsData() {
            try {
                const response = await fetch('/admin/analytics/data');
                const result = await response.json();

                if (result.success) {
                    const data = result.data;

                    // 更新统计卡片
                    document.getElementById('totalPageViews').textContent = data.total_page_views;
                    document.getElementById('totalUserActivities').textContent = data.total_user_activities;
                    document.getElementById('totalUniqueUsers').textContent = data.total_unique_users;
                    document.getElementById('recentPageViews').textContent = data.recent_page_views;

                    // 更新最活跃用户表格
                    const activeUsersTable = document.getElementById('activeUsersTable');
                    activeUsersTable.innerHTML = '';
                    data.active_users.forEach(user => {
                        const row = document.createElement('tr');
                        row.innerHTML = `
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${user.username}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${user.activity_count}</td>
                    `;
                        activeUsersTable.appendChild(row);
                    });

                    // 更新热门页面表格
                    const popularPagesTable = document.getElementById('popularPagesTable');
                    popularPagesTable.innerHTML = '';
                    data.popular_pages.forEach(page => {
                        const row = document.createElement('tr');
                        row.innerHTML = `
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${page.page_url}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${page.view_count}</td>
                    `;
                        popularPagesTable.appendChild(row);
                    });

                    // 创建图表
                    createAnalyticsChart();
                }
            } catch (error) {
                console.error('加载分析数据失败:', error);
            }
        }

        // 创建图表
        function createAnalyticsChart() {
            const ctx = document.getElementById('analyticsChart').getContext('2d');

            // 模拟数据 - 实际应用中应该从API获取时间序列数据
            const chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['1天前', '2天前', '3天前', '4天前', '5天前', '6天前', '7天前'],
                    datasets: [
                        {
                            label: '页面访问量',
                            data: [120, 190, 150, 210, 180, 160, 220],
                            borderColor: '#3b82f6',
                            backgroundColor: 'rgba(59, 130, 246, 0.1)',
                            tension: 0.4
                        },
                        {
                            label: '用户活动',
                            data: [80, 120, 100, 150, 130, 110, 160],
                            borderColor: '#10b981',
                            backgroundColor: 'rgba(16, 185, 129, 0.1)',
                            tension: 0.4
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });
        }

        // 页面加载时获取数据
        document.addEventListener('DOMContentLoaded', function () {
            loadAnalyticsData();
        });
    </script>
{% endblock %}
