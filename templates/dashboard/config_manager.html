{% extends "dashboard/base.html" %}

{% block title %}管理后台 - 配置管理{% endblock %}
{% block page_title %}配置管理{% endblock %}

{% block extra_css %}
    <style>
        .config-section {
            border: 1px solid #e5e7eb;
            border-radius: 0.5rem;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            background-color: #f9fafb;
        }

        .config-section h3 {
            margin-top: 0;
            margin-bottom: 1rem;
            color: #1f2937;
            font-size: 1.125rem;
            font-weight: 600;
        }

        .config-row {
            display: flex;
            flex-wrap: wrap;
            margin: 0 -0.5rem;
        }

        .config-col {
            flex: 1 0 300px;
            padding: 0 0.5rem;
            margin-bottom: 1rem;
        }

        .refresh-btn {
            display: inline-flex;
            align-items: center;
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            font-weight: 500;
            transition: all 0.2s;
        }

        .refresh-btn:hover {
            opacity: 0.9;
        }

        .refresh-btn i {
            margin-right: 0.5rem;
        }
    </style>
{% endblock %}

{% block content %}
    <div class="bg-white rounded-xl shadow-sm p-6 mb-6">
        <h2 class="text-xl font-semibold text-gray-800 mb-4">系统配置管理</h2>
        <p class="text-gray-600">管理系统的各种配置，包括邮件、Redis、S3存储等。配置保存后会立即生效。</p>
    </div>

    <!-- 配置管理区域 -->
    <div class="space-y-6">
        <!-- 邮件配置 -->
        <div class="config-section">
            <h3><i class="fas fa-envelope mr-2 text-blue-500"></i>邮件服务器配置</h3>
            <form id="mailConfigForm">
                <div class="config-row">
                    <div class="config-col">
                        <label for="mail_host" class="block text-sm font-medium text-gray-700 mb-1">SMTP 主机</label>
                        <input type="text" id="mail_host" name="mail_host"
                               value="{{ settings.get('mail_host', '') }}"
                               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                               placeholder="smtp.example.com">
                    </div>

                    <div class="config-col">
                        <label for="mail_port" class="block text-sm font-medium text-gray-700 mb-1">端口</label>
                        <input type="number" id="mail_port" name="mail_port"
                               value="{{ settings.get('mail_port', 465) }}"
                               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>

                    <div class="config-col">
                        <label for="mail_user" class="block text-sm font-medium text-gray-700 mb-1">邮箱地址</label>
                        <input type="email" id="mail_user" name="mail_user"
                               value="{{ settings.get('mail_user', '') }}"
                               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                               placeholder="your-email@example.com">
                    </div>

                    <div class="config-col">
                        <label for="mail_password"
                               class="block text-sm font-medium text-gray-700 mb-1">邮箱密码/授权码</label>
                        <input type="password" id="mail_password" name="mail_password"
                               value="{{ settings.get('mail_password', '') }}"
                               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                               placeholder="输入邮箱密码或授权码">
                    </div>
                </div>

                <div class="mt-4 flex justify-end">
                    <button type="submit"
                            class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition-colors">
                        <i class="fas fa-save mr-2"></i>保存邮件配置
                    </button>
                </div>
            </form>
        </div>
        <!-- S3存储配置 -->
        <div class="config-section">
            <h3><i class="fas fa-cloud mr-2 text-green-500"></i>S3 存储配置</h3>
            <form id="s3ConfigForm">
                <div class="config-row">
                    <div class="config-col">
                        <label for="s3_storage_type" class="block text-sm font-medium text-gray-700 mb-1">S3
                            存储类型</label>
                        <select id="s3_storage_type" name="s3_storage_type"
                                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                            <option value="minio"
                                    {% if settings.get('s3_storage_type', 'none') == 'minio' %}selected{% endif %}>MinIO
                            </option>
                            <option value="aws_s3"
                                    {% if settings.get('s3_storage_type', 'none') == 'aws_s3' %}selected{% endif %}>AWS
                                S3
                            </option>
                            <option value="aliyun_oss"
                                    {% if settings.get('s3_storage_type', 'none') == 'aliyun_oss' %}selected{% endif %}>
                                阿里云OSS
                            </option>
                            <option value="tencent_cos"
                                    {% if settings.get('s3_storage_type', 'none') == 'tencent_cos' %}selected{% endif %}>
                                腾讯云COS
                            </option>
                            <option value="none"
                                    {% if settings.get('s3_storage_type', 'none') == 'none' %}selected{% endif %}>本地存储
                            </option>
                        </select>
                    </div>

                    <div class="config-col">
                        <label for="s3_access_key" class="block text-sm font-medium text-gray-700 mb-1">S3
                            访问密钥</label>
                        <input type="text" id="s3_access_key" name="s3_access_key"
                               value="{{ settings.get('s3_access_key', '') }}"
                               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                               placeholder="S3访问密钥">
                    </div>

                    <div class="config-col">
                        <label for="s3_secret_key" class="block text-sm font-medium text-gray-700 mb-1">S3 密钥</label>
                        <input type="password" id="s3_secret_key" name="s3_secret_key"
                               value="{{ settings.get('s3_secret_key', '') }}"
                               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                               placeholder="S3密钥">
                    </div>

                    <div class="config-col">
                        <label for="s3_region" class="block text-sm font-medium text-gray-700 mb-1">S3 区域</label>
                        <input type="text" id="s3_region" name="s3_region"
                               value="{{ settings.get('s3_region', 'us-east-1') }}"
                               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                               placeholder="如: us-east-1">
                    </div>

                    <div class="config-col">
                        <label for="s3_endpoint" class="block text-sm font-medium text-gray-700 mb-1">S3 端点</label>
                        <input type="url" id="s3_endpoint" name="s3_endpoint"
                               value="{{ settings.get('s3_endpoint', '') }}"
                               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                               placeholder="如: https://s3.amazonaws.com">
                    </div>

                    <div class="config-col">
                        <label for="s3_bucket" class="block text-sm font-medium text-gray-700 mb-1">S3
                            存储桶名称</label>
                        <input type="text" id="s3_bucket" name="s3_bucket"
                               value="{{ settings.get('s3_bucket', 'media-bucket') }}"
                               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                               placeholder="存储桶名称">
                    </div>

                    <div class="config-col">
                        <label for="s3_use_ssl" class="block text-sm font-medium text-gray-700 mb-1">使用SSL</label>
                        <select id="s3_use_ssl" name="s3_use_ssl"
                                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                            <option value="true"
                                    {% if settings.get('s3_use_ssl', 'true') == 'true' %}selected{% endif %}>是
                            </option>
                            <option value="false"
                                    {% if settings.get('s3_use_ssl', 'true') == 'false' %}selected{% endif %}>否
                            </option>
                        </select>
                    </div>
                </div>

                <div class="mt-4 flex justify-end">
                    <button type="submit"
                            class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition-colors">
                        <i class="fas fa-save mr-2"></i>保存S3配置
                    </button>
                </div>
            </form>
        </div>

        <!-- 配置刷新按钮 -->
        <div class="bg-white rounded-xl shadow-sm p-6">
            <h3 class="text-lg font-medium text-gray-800 mb-4">配置管理</h3>
            <div class="flex items-center space-x-4">
                <button id="refreshConfigBtn" class="refresh-btn bg-green-600 text-white hover:bg-green-700">
                    <i class="fas fa-sync-alt mr-2"></i>刷新配置
                </button>
                <p class="text-sm text-gray-600">手动刷新当前系统配置，使数据库中的配置立即生效</p>
            </div>
        </div>
    </div>

    <script>
        // 邮件配置表单提交
        document.getElementById('mailConfigForm').addEventListener('submit', function (e) {
            e.preventDefault();

            const formData = new FormData(this);
            const config = {};

            for (let [key, value] of formData.entries()) {
                config[key] = value;
            }

            // 发送配置到服务器
            fetch('/admin/config-manager', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                credentials: 'include',
                body: `settings=${encodeURIComponent(JSON.stringify(config))}`
            })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        alert('邮件配置保存成功');
                    } else {
                        alert('保存失败: ' + data.message);
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('保存失败');
                });
        });

        // Redis配置表单提交
        document.getElementById('redisConfigForm').addEventListener('submit', function (e) {
            e.preventDefault();

            const formData = new FormData(this);
            const config = {};

            for (let [key, value] of formData.entries()) {
                config[key] = value;
            }

            // 发送配置到服务器
            fetch('/admin/config-manager', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                credentials: 'include',
                body: `settings=${encodeURIComponent(JSON.stringify(config))}`
            })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        alert('Redis配置保存成功');
                    } else {
                        alert('保存失败: ' + data.message);
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('保存失败');
                });
        });

        // S3配置表单提交
        document.getElementById('s3ConfigForm').addEventListener('submit', function (e) {
            e.preventDefault();

            const formData = new FormData(this);
            const config = {};

            for (let [key, value] of formData.entries()) {
                config[key] = value;
            }

            // 发送配置到服务器
            fetch('/admin/config-manager', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                credentials: 'include',
                body: `settings=${encodeURIComponent(JSON.stringify(config))}`
            })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        alert('S3配置保存成功');
                    } else {
                        alert('保存失败: ' + data.message);
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('保存失败');
                });
        });

        // 刷新配置按钮
        document.getElementById('refreshConfigBtn').addEventListener('click', function () {
            fetch('/admin/refresh-config', {
                method: 'POST',
                credentials: 'include'
            })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        alert('配置刷新成功');
                    } else {
                        alert('刷新失败: ' + data.message);
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('刷新失败');
                });
        });
    </script>
{% endblock %}
