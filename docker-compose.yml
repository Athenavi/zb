version: '3.8'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./static:/app/static
      - ./thumbnails:/app/thumbnails
      - ./temp_uploads:/app/temp_uploads
      - ./logs:/app/logs
      - ./cert:/etc/nginx/cert
    depends_on:
      - app
    restart: unless-stopped

  app:
    build: .
    ports:
      - "9421:9421"
    volumes:
      - ./thumbnails:/app/thumbnails
      - ./temp_uploads:/app/temp_uploads
      - ./logs:/app/logs
      - ./.env:/app/.env
    environment:
      - FLASK_ENV=production
      - DB_ENGINE=postgresql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=123456
      - DB_NAME=flaskblog
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DOMAIN=http://localhost:9421
      - SECRET_KEY=your-secret-key-change-in-production
    restart: unless-stopped
    depends_on:
      - db
      - redis
    command: >
      sh -c "python -c 'from src.database import init_db; init_db()' && 
             gunicorn --config gunicorn.conf.py wsgi:application"

  db:
    image: postgres:17.4-alpine
    environment:
      - POSTGRES_DB=flaskblog
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=123456
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/blog.sql:/docker-entrypoint-initdb.d/01-blog.sql
      - ./sql/vip_plans.sql:/docker-entrypoint-initdb.d/02-vip_plans.sql
      - ./sql/vip_features.sql:/docker-entrypoint-initdb.d/03-vip_features.sql
    ports:
      - "5432:5432"
    restart: unless-stopped

  redis:
    image: redis:alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

volumes:
  postgres_data:
  redis_data: