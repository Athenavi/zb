version: '3.14'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./static:/app/static
      - ./uploaded_files:/app/uploaded_files
      - ./cert:/etc/nginx/cert
    depends_on:
      - app
    restart: unless-stopped

  app:
    build: .
    expose:
      - "9421"
    volumes:
      - ./logs:/app/logs
      - ./static:/app/static
      - ./uploaded_files:/app/uploaded_files
    environment:
      - FLASK_ENV=production
    restart: unless-stopped
    command: gunicorn --config gunicorn.conf.py wsgi:application

  redis:
    image: redis:alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  redis_data: