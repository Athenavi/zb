# Nginx配置文件
# 适用于生产环境部署

# 定义上游服务器组（负载均衡）
upstream app_server {
    # Gunicorn应用服务器地址（可以根据实际部署增加更多服务器）
    server 127.0.0.1:9421 fail_timeout=0;
    # 示例：添加更多服务器以实现负载均衡
    # server 127.0.0.1:9422;
    # server 127.0.0.1:9423;
}

# HTTP服务器配置
server {
    # 监听端口
    listen 80;
    server_name your_domain.com www.your_domain.com;  # 替换为你的域名

    # 日志配置
    access_log /var/log/nginx/access.log combined;
    error_log /var/log/nginx/error.log;

    # 客户端最大_body大小
    client_max_body_size 100M;

    # 定义错误页面
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }

    # 静态文件处理
    location /static/ {
        alias /path/to/your/project/static/;  # 替换为你的静态文件路径
        expires 30d;
        add_header Cache-Control "public, immutable";
        
        # 安全头设置
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
    }

    # 媒体文件处理
    location /media/ {
        alias /path/to/your/project/uploaded_files/;  # 替换为你的媒体文件路径
        expires 7d;
        add_header Cache-Control "public";
        
        # 安全头设置
        add_header X-Content-Type-Options nosniff;
    }

    # 健康检查端点（不转发到应用服务器）
    location = /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # WebSocket连接处理
    location /socket.io/ {
        proxy_pass http://app_server/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        
        # WebSocket特定设置
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # RTMP回调处理
    location /live/rtmp/callback {
        proxy_pass http://app_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 设置超时
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 应用代理（所有其他请求）
    location / {
        proxy_pass http://app_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        
        # 设置超时
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # 安全头设置
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header X-XSS-Protection "1; mode=block";
    }
}

